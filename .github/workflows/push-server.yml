name: Deploy push server

on:
  push:
    branches: [claude/wellness-reminder-app-x5a579]
    paths: ['push/**', '.github/workflows/push-server.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: push-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Skipping: add a CLOUDFLARE_API_TOKEN secret first (repo Settings → Secrets and variables → Actions)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.token.outputs.ok == 'true'
        working-directory: push
        run: npm ci

      - name: Deploy to Cloudflare
        if: steps.token.outputs.ok == 'true'
        id: deploy
        working-directory: push
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but couldn't find the workers.dev address. Open Workers & Pages in the Cloudflare dashboard once so it sets one up, then run this again."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Point the app at the server
        if: steps.token.outputs.ok == 'true'
        run: |
          printf '{\n  "server": "%s"\n}\n' "${{ steps.deploy.outputs.url }}" > push-config.json
          if git ls-files --error-unmatch push-config.json >/dev/null 2>&1 && git diff --quiet -- push-config.json; then
            echo "App already points at ${{ steps.deploy.outputs.url }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-config.json
          git commit -m "Point the app at the push server"
          git push
